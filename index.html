<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          vault: {
            bg: '#14171C',
            panel: '#1B1F26',
            panel2: '#20242C',
            border: '#2B303A',
            borderlight: '#383E4A',
            text: '#ECEEF1',
            muted: '#8B93A3',
            faint: '#5C6373',
            brass: '#C9A227',
            brassdim: '#8F7420',
            danger: '#C0524A',
          }
        },
        fontFamily: {
          display: ['"Fraunces"', 'serif'],
          sans: ['"Inter"', 'sans-serif'],
        },
        borderRadius: {
          vault: '3px',
        }
      }
    }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; }
  ::selection { background: #C9A227; color: #14171C; }
  * { -webkit-tap-highlight-color: transparent; }
  input:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid #C9A227; outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  .drop-active { border-color: #C9A227 !important; background: rgba(201,162,39,0.06); }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast-enter { animation: toastIn 0.25s ease-out; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .dial { transition: transform 0.6s cubic-bezier(.2,.8,.2,1); }
</style>
</head>

<!-- Toast container -->
<div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-[calc(100%-2rem)] max-w-sm"></div>

<!-- ===================== AUTH VIEW ===================== -->
<div id="authView" class="min-h-screen flex items-center justify-center px-6">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-10">
      <img src="https://i.postimg.cc/j5VL0xjW/1719849589430.jpg" alt="Md_Hussain" class="w-12 h-12 rounded-full object-cover border border-vault-border mb-4" />
      <h1 class="font-display text-3xl text-vault-text">Md_Hussain</h1>
      <p class="text-vault-muted text-sm mt-1">A private place for your files</p>
    </div>

    <div class="bg-vault-panel border border-vault-border rounded-vault p-6">
      <div class="flex text-sm mb-6 border-b border-vault-border">
        <button id="tabLogin" class="flex-1 pb-3 text-vault-text border-b-2 border-vault-brass font-medium">Log in</button>
        <button id="tabSignup" class="flex-1 pb-3 text-vault-muted border-b-2 border-transparent font-medium">Sign up</button>
      </div>

      <form id="authForm" class="flex flex-col gap-4">
        <div>
          <label class="block text-xs text-vault-muted mb-1.5" for="email">Email</label>
          <input id="email" type="email" required autocomplete="email"
            class="w-full bg-vault-panel2 border border-vault-border rounded-vault px-3 py-2.5 text-sm text-vault-text placeholder-vault-faint focus:border-vault-brass transition-colors"
            placeholder="you@example.com" />
        </div>
        <div>
          <label class="block text-xs text-vault-muted mb-1.5" for="password">Password</label>
          <input id="password" type="password" required autocomplete="current-password" minlength="6"
            class="w-full bg-vault-panel2 border border-vault-border rounded-vault px-3 py-2.5 text-sm text-vault-text placeholder-vault-faint focus:border-vault-brass transition-colors"
            placeholder="••••••••" />
        </div>
        <p id="authError" class="text-sm text-vault-danger hidden"></p>
        <button id="authSubmit" type="submit"
          class="mt-2 bg-vault-brass hover:bg-[#DBB13A] text-vault-bg font-medium text-sm rounded-vault py-2.5 transition-colors flex items-center justify-center gap-2">
          <span id="authSubmitLabel">Log in</span>
          <svg id="authSpinner" class="hidden spin" width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#14171C" stroke-width="3" stroke-dasharray="45" stroke-linecap="round"/></svg>
        </button>
      </form>
    </div>
    <p class="text-center text-xs text-vault-faint mt-6">Your files are encrypted in transit and only ever visible to you.</p>
  </div>
</div>

<!-- ===================== APP VIEW ===================== -->
<div id="appView" class="hidden min-h-screen flex flex-col">
  <header class="border-b border-vault-border px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <img src="https://i.postimg.cc/j5VL0xjW/1719849589430.jpg" alt="Md_Hussain" class="w-8 h-8 rounded-full object-cover border border-vault-border" />
      <span class="font-display text-lg">Md_Hussain</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="userEmail" class="text-xs text-vault-muted hidden sm:block"></span>
      <button id="logoutBtn" class="text-sm text-vault-muted hover:text-vault-text border border-vault-border hover:border-vault-borderlight rounded-vault px-3 py-1.5 transition-colors">Log out</button>
    </div>
  </header>

  <main class="flex-1 px-6 py-8 max-w-5xl w-full mx-auto">
    <!-- Breadcrumb + folder actions -->
    <div class="flex items-center justify-between mb-4 gap-3 flex-wrap">
      <nav id="breadcrumb" class="flex items-center gap-1 text-sm flex-wrap"></nav>
      <button id="newFolderBtn" class="text-sm text-vault-muted hover:text-vault-text border border-vault-border hover:border-vault-borderlight rounded-vault px-3 py-1.5 transition-colors flex items-center gap-1.5 shrink-0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" stroke="currentColor" stroke-width="1.5"/><path d="M12 11v4M10 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        New folder
      </button>
    </div>

    <!-- Drop zone -->
    <div id="dropZone" class="border border-dashed border-vault-border rounded-vault px-6 py-10 flex flex-col items-center justify-center text-center transition-colors cursor-pointer">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" class="mb-3 text-vault-muted">
        <path d="M12 16V4M12 4L7 9M12 4l5 5" stroke="#8B93A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke="#8B93A3" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p class="text-sm text-vault-text">Drop files here, or <span class="text-vault-brass">browse</span></p>
      <p class="text-xs text-vault-faint mt-1">Documents and images, up to 50MB each</p>
      <input id="fileInput" type="file" multiple class="hidden" />
    </div>

    <!-- Upload progress -->
    <div id="uploadList" class="mt-3 flex flex-col gap-2"></div>

    <!-- Section header -->
    <div class="flex items-center justify-between mt-10 mb-4">
      <h2 class="font-display text-xl">Contents</h2>
      <span id="fileCount" class="text-xs text-vault-faint"></span>
    </div>

    <!-- Loading state -->
    <div id="loadingState" class="flex items-center justify-center py-16 text-vault-muted text-sm gap-2">
      <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#8B93A3" stroke-width="3" stroke-dasharray="45" stroke-linecap="round"/></svg>
      Opening the vault…
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center">
      <svg width="36" height="36" viewBox="0 0 40 40" fill="none" class="mb-4 opacity-60">
        <circle cx="20" cy="20" r="19" stroke="#383E4A" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="12" stroke="#2B303A" stroke-width="1"/>
        <circle cx="20" cy="20" r="2" fill="#5C6373"/>
      </svg>
      <p class="text-vault-text text-sm">Nothing here yet</p>
      <p class="text-vault-faint text-xs mt-1">Drag a file in, or create a folder to get organized</p>
    </div>

    <!-- File grid -->
    <div id="fileGrid" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
  </main>
</div>

<!-- Preview modal -->
<div id="previewModal" class="hidden fixed inset-0 bg-black/70 z-40 items-center justify-center px-6" role="dialog" aria-modal="true">
  <div class="bg-vault-panel border border-vault-border rounded-vault max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-vault-border">
      <span id="previewName" class="text-sm text-vault-text truncate"></span>
      <button id="previewClose" class="text-vault-muted hover:text-vault-text text-lg leading-none px-1">✕</button>
    </div>
    <div class="p-4 overflow-auto flex-1 flex items-center justify-center">
      <img id="previewImg" class="max-w-full max-h-[65vh] rounded-vault" />
    </div>
  </div>
</div>

<script>
(function () {
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---------- DOM refs ----------
  const authView = document.getElementById('authView');
  const appView = document.getElementById('appView');
  const authForm = document.getElementById('authForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const authError = document.getElementById('authError');
  const authSubmit = document.getElementById('authSubmit');
  const authSubmitLabel = document.getElementById('authSubmitLabel');
  const authSpinner = document.getElementById('authSpinner');
  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');
  const userEmail = document.getElementById('userEmail');
  const logoutBtn = document.getElementById('logoutBtn');
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const uploadList = document.getElementById('uploadList');
  const loadingState = document.getElementById('loadingState');
  const emptyState = document.getElementById('emptyState');
  const fileGrid = document.getElementById('fileGrid');
  const fileCount = document.getElementById('fileCount');
  const toastContainer = document.getElementById('toastContainer');
  const previewModal = document.getElementById('previewModal');
  const previewImg = document.getElementById('previewImg');
  const previewName = document.getElementById('previewName');
  const previewClose = document.getElementById('previewClose');
  const breadcrumbEl = document.getElementById('breadcrumb');
  const newFolderBtn = document.getElementById('newFolderBtn');

  let mode = 'login'; // or 'signup'
  let currentUser = null;
  let pathSegments = []; // current folder path, relative to the user's own root

  // ---------- Toasts ----------
  function toast(message, type = 'info') {
    const el = document.createElement('div');
    const colors = { info: 'border-vault-border', success: 'border-vault-brass', error: 'border-vault-danger' };
    el.className = `toast-enter bg-vault-panel border ${colors[type] || colors.info} rounded-vault px-4 py-3 text-sm text-vault-text shadow-lg`;
    el.textContent = message;
    toastContainer.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity 0.3s';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 300);
    }, 3200);
  }

  // ---------- Auth tab switching ----------
  function setMode(next) {
    mode = next;
    authError.classList.add('hidden');
    if (mode === 'login') {
      tabLogin.classList.add('text-vault-text', 'border-vault-brass');
      tabLogin.classList.remove('text-vault-muted', 'border-transparent');
      tabSignup.classList.remove('text-vault-text', 'border-vault-brass');
      tabSignup.classList.add('text-vault-muted', 'border-transparent');
      authSubmitLabel.textContent = 'Log in';
      passwordInput.setAttribute('autocomplete', 'current-password');
    } else {
      tabSignup.classList.add('text-vault-text', 'border-vault-brass');
      tabSignup.classList.remove('text-vault-muted', 'border-transparent');
      tabLogin.classList.remove('text-vault-text', 'border-vault-brass');
      tabLogin.classList.add('text-vault-muted', 'border-transparent');
      authSubmitLabel.textContent = 'Create account';
      passwordInput.setAttribute('autocomplete', 'new-password');
    }
  }
  tabLogin.addEventListener('click', () => setMode('login'));
  tabSignup.addEventListener('click', () => setMode('signup'));

  // ---------- Auth submit ----------
  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authError.classList.add('hidden');
    authSubmit.disabled = true;
    authSpinner.classList.remove('hidden');
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    try {
      if (mode === 'login') {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        toast('Account created. Check your inbox if email confirmation is required.', 'success');
      }
    } catch (err) {
      authError.textContent = err.message || 'Something went wrong. Try again.';
      authError.classList.remove('hidden');
    } finally {
      authSubmit.disabled = false;
      authSpinner.classList.add('hidden');
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
  });

  // ---------- Session handling ----------
  supabaseClient.auth.onAuthStateChange((_event, session) => {
    if (session && session.user) {
      currentUser = session.user;
      showApp();
    } else {
      currentUser = null;
      showAuth();
    }
  });

  function showAuth() {
    authView.classList.remove('hidden');
    appView.classList.add('hidden');
    authForm.reset();
  }

  function showApp() {
    authView.classList.add('hidden');
    appView.classList.remove('hidden');
    userEmail.textContent = currentUser.email;
    pathSegments = [];
    loadFiles();
  }

  // ---------- Folder helpers ----------
  function currentFolderPrefix() {
    // Full storage path (bucket-relative) of the folder currently being viewed
    return currentUser.id + (pathSegments.length ? '/' + pathSegments.join('/') : '');
  }

  function renderBreadcrumb() {
    breadcrumbEl.innerHTML = '';
    const homeBtn = document.createElement('button');
    homeBtn.textContent = 'Home';
    homeBtn.className = pathSegments.length
      ? 'text-vault-muted hover:text-vault-text transition-colors'
      : 'text-vault-text';
    homeBtn.addEventListener('click', () => { pathSegments = []; loadFiles(); });
    breadcrumbEl.appendChild(homeBtn);

    pathSegments.forEach((seg, idx) => {
      const sep = document.createElement('span');
      sep.textContent = '/';
      sep.className = 'text-vault-faint mx-1';
      breadcrumbEl.appendChild(sep);

      const isLast = idx === pathSegments.length - 1;
      const btn = document.createElement('button');
      btn.textContent = seg;
      btn.className = isLast
        ? 'text-vault-text'
        : 'text-vault-muted hover:text-vault-text transition-colors';
      btn.addEventListener('click', () => { pathSegments = pathSegments.slice(0, idx + 1); loadFiles(); });
      breadcrumbEl.appendChild(btn);
    });
  }

  newFolderBtn.addEventListener('click', async () => {
    const raw = prompt('Name this folder');
    if (raw === null) return;
    const name = sanitizeFilename(raw.trim());
    if (!name) { toast('Folder needs a name', 'error'); return; }

    const placeholderPath = `${currentFolderPrefix()}/${name}/.emptyFolderPlaceholder`;
    const { error } = await supabaseClient.storage
      .from(BUCKET_NAME)
      .upload(placeholderPath, new Blob([''], { type: 'text/plain' }), { upsert: false });

    if (error) {
      toast(`Couldn't create folder: ${error.message}`, 'error');
    } else {
      toast(`"${name}" created`, 'success');
      loadFiles();
    }
  });

  // Recursively collects every file path stored under a given folder prefix
  async function listAllFilePaths(prefix) {
    const { data, error } = await supabaseClient.storage.from(BUCKET_NAME).list(prefix, { limit: 1000 });
    if (error || !data) return [];
    let paths = [];
    for (const entry of data) {
      const entryPath = `${prefix}/${entry.name}`;
      if (entry.id === null) {
        paths = paths.concat(await listAllFilePaths(entryPath));
      } else {
        paths.push(entryPath);
      }
    }
    return paths;
  }

  async function deleteFolder(name) {
    if (!confirm(`Delete "${name}" and everything inside it? This can't be undone.`)) return;
    const prefix = `${currentFolderPrefix()}/${name}`;
    const allPaths = await listAllFilePaths(prefix);
    if (allPaths.length) {
      const { error } = await supabaseClient.storage.from(BUCKET_NAME).remove(allPaths);
      if (error) { toast(`Couldn't delete "${name}": ${error.message}`, 'error'); return; }
    }
    toast(`"${name}" deleted`, 'success');
    loadFiles();
  }

  function renderFolderCard(name) {
    const card = document.createElement('div');
    card.className = 'bg-vault-panel border border-vault-border rounded-vault overflow-hidden flex flex-col cursor-pointer group';
    card.innerHTML = `
      <div class="aspect-square bg-vault-panel2 flex items-center justify-center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" stroke="#C9A227" stroke-width="1.4"/></svg>
      </div>
      <div class="px-2.5 py-2 flex items-center justify-between gap-2">
        <span class="text-xs text-vault-text truncate" title="${escapeHtml(name)}">${escapeHtml(name)}</span>
        <button data-action="deleteFolder" class="text-vault-muted hover:text-vault-danger p-1 opacity-70 group-hover:opacity-100 transition-opacity" title="Delete folder">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0-1 14a1 1 0 01-1 1H7a1 1 0 01-1-1L5 6h14z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    `;
    card.addEventListener('click', (e) => {
      if (e.target.closest('[data-action="deleteFolder"]')) return;
      pathSegments.push(name);
      loadFiles();
    });
    card.querySelector('[data-action="deleteFolder"]').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteFolder(name);
    });
    return card;
  }

  // ---------- Upload ----------
  ['dragenter', 'dragover'].forEach(evt =>
    dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add('drop-active'); })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.remove('drop-active'); })
  );
  dropZone.addEventListener('drop', (e) => {
    const files = e.dataTransfer.files;
    if (files.length) handleFiles(files);
  });
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFiles(fileInput.files);
    fileInput.value = '';
  });

  async function handleFiles(fileListObj) {
    const files = Array.from(fileListObj);
    for (const file of files) {
      await uploadOne(file);
    }
    loadFiles();
  }

  async function uploadOne(file) {
    const row = document.createElement('div');
    row.className = 'flex items-center justify-between bg-vault-panel border border-vault-border rounded-vault px-3 py-2 text-sm';
    row.innerHTML = `
      <span class="truncate mr-3">${escapeHtml(file.name)}</span>
      <svg class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#C9A227" stroke-width="3" stroke-dasharray="45" stroke-linecap="round"/></svg>
    `;
    uploadList.appendChild(row);

    const path = `${currentFolderPrefix()}/${Date.now()}_${sanitizeFilename(file.name)}`;
    const { error } = await supabaseClient.storage.from(BUCKET_NAME).upload(path, file, { upsert: false });

    row.remove();
    if (error) {
      toast(`Couldn't upload ${file.name}: ${error.message}`, 'error');
    } else {
      toast(`${file.name} stored`, 'success');
    }
  }

  function sanitizeFilename(name) {
    return name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
  }
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- List files ----------
  async function loadFiles() {
    renderBreadcrumb();
    loadingState.classList.remove('hidden');
    emptyState.classList.add('hidden');
    fileGrid.classList.add('hidden');

    const { data, error } = await supabaseClient.storage.from(BUCKET_NAME).list(currentFolderPrefix(), {
      sortBy: { column: 'name', order: 'asc' },
    });

    loadingState.classList.add('hidden');

    if (error) {
      toast(`Couldn't load this folder: ${error.message}`, 'error');
      emptyState.classList.remove('hidden');
      emptyState.classList.add('flex');
      return;
    }

    const entries = data || [];
    const folders = entries.filter(e => e.id === null).map(e => e.name);
    const files = entries.filter(e => e.id && e.name !== '.emptyFolderPlaceholder');

    const total = folders.length + files.length;
    fileCount.textContent = total ? `${folders.length ? folders.length + ' folder' + (folders.length === 1 ? '' : 's') : ''}${folders.length && files.length ? ', ' : ''}${files.length ? files.length + ' file' + (files.length === 1 ? '' : 's') : ''}` : '';

    if (!total) {
      emptyState.classList.remove('hidden');
      emptyState.classList.add('flex');
      return;
    }

    fileGrid.classList.remove('hidden');
    fileGrid.innerHTML = '';
    for (const name of folders) {
      fileGrid.appendChild(renderFolderCard(name));
    }
    for (const f of files) {
      fileGrid.appendChild(await renderFileCard(f));
    }
  }

  function isImage(name) {
    return /\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(name);
  }

  async function renderFileCard(f) {
    const path = `${currentFolderPrefix()}/${f.name}`;
    const displayName = f.name.replace(/^\d+_/, '');
    const card = document.createElement('div');
    card.className = 'bg-vault-panel border border-vault-border rounded-vault overflow-hidden flex flex-col group';

    let thumbHtml;
    if (isImage(f.name)) {
      const { data: signed } = await supabaseClient.storage.from(BUCKET_NAME).createSignedUrl(path, 3600);
      const url = signed ? signed.signedUrl : '';
      thumbHtml = `<div class="aspect-square bg-vault-panel2 cursor-pointer overflow-hidden" data-action="preview" data-url="${url}" data-name="${escapeHtml(displayName)}">
        <img src="${url}" class="w-full h-full object-cover" loading="lazy" alt="${escapeHtml(displayName)}" />
      </div>`;
    } else {
      thumbHtml = `<div class="aspect-square bg-vault-panel2 flex items-center justify-center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" stroke="#5C6373" stroke-width="1.4"/><path d="M14 2v6h6" stroke="#5C6373" stroke-width="1.4"/></svg>
      </div>`;
    }

    card.innerHTML = `
      ${thumbHtml}
      <div class="px-2.5 py-2 flex items-center justify-between gap-2">
        <span class="text-xs text-vault-text truncate" title="${escapeHtml(displayName)}">${escapeHtml(displayName)}</span>
        <div class="flex items-center gap-1 opacity-70 group-hover:opacity-100 transition-opacity">
          <button data-action="download" class="text-vault-muted hover:text-vault-brass p-1" title="Download">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M12 16l-4-4M12 16l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 18v1a2 2 0 002 2h12a2 2 0 002-2v-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button data-action="delete" class="text-vault-muted hover:text-vault-danger p-1" title="Delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0-1 14a1 1 0 01-1 1H7a1 1 0 01-1-1L5 6h14z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    `;

    const thumb = card.querySelector('[data-action="preview"]');
    if (thumb) {
      thumb.addEventListener('click', () => openPreview(thumb.dataset.url, thumb.dataset.name));
    }
    card.querySelector('[data-action="download"]').addEventListener('click', () => downloadFile(path, displayName));
    card.querySelector('[data-action="delete"]').addEventListener('click', () => deleteFile(path, displayName));

    return card;
  }

  function openPreview(url, name) {
    previewImg.src = url;
    previewName.textContent = name;
    previewModal.classList.remove('hidden');
    previewModal.classList.add('flex');
  }
  previewClose.addEventListener('click', closePreview);
  previewModal.addEventListener('click', (e) => { if (e.target === previewModal) closePreview(); });
  function closePreview() {
    previewModal.classList.add('hidden');
    previewModal.classList.remove('flex');
    previewImg.src = '';
  }

  async function downloadFile(path, displayName) {
    const { data, error } = await supabaseClient.storage.from(BUCKET_NAME).createSignedUrl(path, 60, { download: displayName });
    if (error) { toast(`Couldn't download: ${error.message}`, 'error'); return; }
    const a = document.createElement('a');
    a.href = data.signedUrl;
    a.download = displayName;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  async function deleteFile(path, displayName) {
    if (!confirm(`Delete "${displayName}"? This can't be undone.`)) return;
    const { error } = await supabaseClient.storage.from(BUCKET_NAME).remove([path]);
    if (error) {
      toast(`Couldn't delete: ${error.message}`, 'error');
    } else {
      toast(`${displayName} deleted`, 'success');
      loadFiles();
    }
  }

  // initial mode
  setMode('login');
})();
</script>
</body>
</html>
